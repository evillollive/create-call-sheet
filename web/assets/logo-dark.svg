<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Create Call Sheet">
  <title>Create Call Sheet</title>
  <!-- icon: clapperboard whose sheet is call-sheet rows -->
  <g transform="translate(4 12)">
    <rect x="0" y="16" width="50" height="34" rx="5" fill="#ffd400"/>
    <g transform="rotate(-8 25 13)">
      <rect x="0" y="6" width="50" height="12" rx="2.5" fill="#fff"/>
      <path d="M2 18 L9 6 L17 6 L10 18 Z M19 18 L26 6 L34 6 L27 18 Z M36 18 L43 6 L51 6 L44 18 Z" fill="#111"/>
    </g>
    <rect x="8" y="25" width="22" height="3.4" rx="1.7" fill="#111"/>
    <rect x="8" y="33" width="33" height="3.4" rx="1.7" fill="#111"/>
    <rect x="8" y="41" width="26" height="3.4" rx="1.7" fill="#111"/>
  </g>
  <!-- wordmark -->
  <text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" letter-spacing="0.5" fill="#ffffff">CREATE</text>
  <text x="70" y="57" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" letter-spacing="0.5" fill="#ffd400">CALL SHEET</text>
</svg>
