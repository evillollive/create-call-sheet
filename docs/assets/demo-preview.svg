<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Create Call Sheet demo preview</title>
  <desc id="desc">A browser form generates a polished multi-day production call sheet workbook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="210" fill="#ffd400" opacity="0.18"/>
  <circle cx="130" cy="650" r="180" fill="#38bdf8" opacity="0.13"/>

  <g transform="translate(70 70)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Create Call Sheet</text>
    <text x="0" y="44" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">Guided production call sheets, exported as styled .xlsx workbooks</text>
  </g>

  <g transform="translate(70 145)" filter="url(#shadow)">
    <rect width="470" height="500" rx="24" fill="#ffffff"/>
    <rect x="0" y="0" width="470" height="76" rx="24" fill="#111111"/>
    <text x="32" y="48" fill="#ffd400" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Browser app</text>
    <text x="320" y="48" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16">No account</text>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="32" y="120" fill="#111827" font-size="18" font-weight="700">1. Project</text>
      <rect x="32" y="137" width="390" height="42" rx="8" fill="#f8fafc" stroke="#d4d4d8"/>
      <text x="48" y="164" fill="#64748b" font-size="15">Product launch interview day</text>

      <text x="32" y="214" fill="#111827" font-size="18" font-weight="700">2. Shoot day</text>
      <rect x="32" y="231" width="180" height="42" rx="8" fill="#f8fafc" stroke="#d4d4d8"/>
      <text x="48" y="258" fill="#64748b" font-size="15">8:00 AM call</text>
      <rect x="232" y="231" width="190" height="42" rx="8" fill="#f8fafc" stroke="#d4d4d8"/>
      <text x="248" y="258" fill="#64748b" font-size="15">Studio A</text>

      <text x="32" y="308" fill="#111827" font-size="18" font-weight="700">3. Contacts and schedule</text>
      <rect x="32" y="326" width="390" height="30" rx="7" fill="#f4f4f5"/>
      <rect x="32" y="366" width="390" height="30" rx="7" fill="#f4f4f5"/>
      <rect x="32" y="406" width="390" height="30" rx="7" fill="#f4f4f5"/>

      <rect x="32" y="458" width="180" height="44" rx="10" fill="#ffd400"/>
      <text x="62" y="486" fill="#111111" font-size="16" font-weight="700">Generate .xlsx</text>
    </g>
  </g>

  <g transform="translate(520 180)" filter="url(#shadow)">
    <rect width="610" height="430" rx="18" fill="#ffffff"/>
    <rect x="0" y="0" width="610" height="52" rx="18" fill="#111111"/>
    <text x="26" y="35" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CALL SHEET</text>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="26" y="88" fill="#111111" font-size="24" font-weight="700">Product Launch Shoot</text>
      <rect x="384" y="65" width="86" height="36" rx="4" fill="#f4f4f5"/>
      <text x="402" y="88" fill="#111111" font-size="13" font-weight="700">DAY 1</text>
      <rect x="482" y="65" width="102" height="36" rx="4" fill="#f4f4f5"/>
      <text x="497" y="88" fill="#111111" font-size="13" font-weight="700">FRIDAY</text>

      <rect x="26" y="124" width="558" height="28" fill="#111111"/>
      <text x="42" y="144" fill="#ffffff" font-size="14" font-weight="700">AT A GLANCE</text>
      <rect x="26" y="166" width="150" height="78" fill="#ffd400"/>
      <text x="58" y="199" fill="#111111" font-size="15" font-weight="700">CREW CALL</text>
      <text x="62" y="222" fill="#111111" font-size="24" font-weight="700">8:00 AM</text>
      <rect x="190" y="166" width="190" height="78" fill="#ffffff" stroke="#d4d4d8"/>
      <text x="225" y="197" fill="#2563eb" font-size="14" font-weight="700">LOCATION</text>
      <text x="222" y="220" fill="#111111" font-size="14">Clickable maps link</text>
      <rect x="394" y="166" width="190" height="78" fill="#ffffff" stroke="#d4d4d8"/>
      <text x="425" y="197" fill="#2563eb" font-size="14" font-weight="700">HOSPITAL</text>
      <text x="422" y="220" fill="#111111" font-size="14">Emergency details</text>

      <rect x="26" y="270" width="558" height="28" fill="#111111"/>
      <text x="42" y="290" fill="#ffffff" font-size="14" font-weight="700">SCHEDULE</text>
      <g fill="#f8fafc" stroke="#d4d4d8">
        <rect x="26" y="312" width="558" height="34"/>
        <rect x="26" y="346" width="558" height="34"/>
        <rect x="26" y="380" width="558" height="34"/>
      </g>
      <g fill="#334155" font-size="14">
        <text x="42" y="334">8:00 AM</text><text x="130" y="334">Crew arrives, load in</text>
        <text x="42" y="368">10:00 AM</text><text x="130" y="368">Interview 1</text>
        <text x="42" y="402">5:00 PM</text><text x="130" y="402">Wrap and load out</text>
      </g>
    </g>
  </g>

  <g transform="translate(745 633)" font-family="Arial, Helvetica, sans-serif">
    <rect width="385" height="44" rx="22" fill="#ffd400"/>
    <text x="25" y="29" fill="#111111" font-size="17" font-weight="700">Local-first, production-ready, shareable</text>
  </g>
</svg>
